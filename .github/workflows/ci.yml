name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # The engine's suite evaluates against a real FHIR model, supplied by
      # the R4 binding. Resolved from pub.dev it would test the *released*
      # binding, so an engine change that needs a matching binding change
      # could never go green — the same trap fhir_r4's own CI documents.
      # Check the binding out and override to it. pubspec_overrides.yaml is
      # gitignored, so this is build-time only.
      - name: Check out the R4 binding
        uses: actions/checkout@v4
        with:
          repository: fhir-fli/fhir_r4
          ref: dev
          path: .fhir_r4

      - name: Resolve the binding from that checkout
        run: |
          {
            echo "# Generated by CI: test against the binding as it is on dev,"
            echo "# not as it is on pub.dev."
            echo "dependency_overrides:"
            echo "  fhir_r4:"
            echo "    path: ${GITHUB_WORKSPACE}/.fhir_r4/packages/fhir_r4"
            echo "  fhir_r4_path:"
            echo "    path: ${GITHUB_WORKSPACE}/.fhir_r4/packages/fhir_r4_path"
          } > pubspec_overrides.yaml

      - name: Install dependencies
        run: dart pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: dart analyze
      - name: Run tests
        if: hashFiles('test/**') != ''
        run: dart test
